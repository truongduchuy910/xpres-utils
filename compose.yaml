name: xpres-utils

services:
  lockfile:
    profiles: [lockfile]
    image: node:24-alpine
    platform: linux/amd64
    working_dir: /app
    volumes:
      - .:/app
      - synplan_admin_node_modules:/app/node_modules
    command:
      - sh
      - -c
      - |
        npm install -g npm@latest && \
        npm install --force
